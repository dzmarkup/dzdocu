<!--
  DZDOCU MOVED TO DZ DROP ZONE
  =====================================================================

  The app now lives at dzdropzone.com/dzdocu/, alongside DZMarkup and
  DZVidStitch. This page is all that is left at the old address: it sends
  anyone arriving here to the hub.

  Done in the repo rather than as DNS forwarding, deliberately. Porkbun
  forwarding means deleting this domain's A records, after which the
  domain serves nothing of its own -- no way to say a word to whoever
  arrives, and no way back without redoing DNS. A page costs one file and
  leaves every option open.

  It goes to dzdropzone.com and NOT to dzdropzone.com/dzdocu/ on purpose:
  someone landing on the old domain should see the whole site, not be
  dropped straight back into a single app.

  Three details worth keeping if this is ever edited:

  - location.replace(), not location.href. replace() leaves no history
    entry, so Back from the hub goes wherever they actually came from
    rather than bouncing them through this page again.
  - The meta refresh is the no-JavaScript path. Both are here because
    either one on its own leaves somebody stranded.
  - The visible link is the third fallback and the only one that survives
    both being blocked. It is a real link, not a scripted button.

  DZDocu registers no service worker, so nothing cached can keep serving
  the old app after this goes live. (DZMarkup DOES have one -- if that
  domain is ever pointed at a page like this, it needs an unregister step
  this page does not have.)

  The app's assets/ folder is still in this repo. It is dead weight while
  this page is the index, and is left alone deliberately: it costs
  nothing on Pages, and it is where the standalone copy's history lives
  if anyone ever needs to look at it.
-->

<meta http-equiv="refresh" content="0; url=https://dzdropzone.com/">
<script>
  // Runs before the body paints, so in practice this page is never seen.
  location.replace('https://dzdropzone.com/');
</script>
